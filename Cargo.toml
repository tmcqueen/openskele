[workspace]
resolver = "2"
members = [
    "crates/skele-protocol",
    "crates/skele-core",
    "crates/tauri-plugin-skele",
    "apps/workbench/src-tauri",
]
# The Tauri crates need the system webview dev libraries; plain `cargo build`
# and `cargo test` cover the headless core only.
default-members = ["crates/skele-protocol", "crates/skele-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
skele-protocol = { path = "crates/skele-protocol" }
skele-core = { path = "crates/skele-core" }
tauri-plugin-skele = { path = "crates/tauri-plugin-skele" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }
