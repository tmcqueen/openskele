[package]
name = "skele-core"
description = "Headless workbench core: registries, event bus, config, plugin host, PTY, documents"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
specta = ["dep:specta", "skele-protocol/specta"]

[dependencies]
skele-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
specta = { workspace = true, optional = true }
jsonschema = { version = "0.61", default-features = false }
portable-pty = "0.9"
ropey = "1"

[dev-dependencies]
tempfile = "3"
